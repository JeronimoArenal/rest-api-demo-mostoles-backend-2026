spring.application.name=rest-api-demo-mostoles-backend-2026

# ===================================================================
# SECURITY (false -> desactiva - true -> activa)
# ===================================================================
app.security.enabled=true

#Configurar las credenciales de conexion a la base de datos
spring.datasource.url=jdbc:mysql://192.168.122.43:3306/comercio_mostoles?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_MYSQL_USERNAME:root}
spring.datasource.password=${DB_MYSQL_PASSWORD:Kose9suf}


# Para configurar el ORM Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Clave secreta de 256 bits para producción
# Se pueden generar tokens en la siguiente url https://jwtsecrets.com/#generator
demo.app.jwtSecret=bXktc3VwZXItc2VjcmV0LWtleS1mb3ItanZ0LTIwMjYtY29tZXJjaW8tbW9zdG9sZXM=
demo.app.jwtExpirationMs=86400000


# FileUpload and Download
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# La siguiente clave (key) ofrece mas informacion por la consola respecto a las consultas
# o sentencias del SQL generadas por HIBERNATE
spring.jpa.properties.hibernate.format_sql=true

# Para que un tipo primitivo que no admita null le asigne el valor de cero
spring.jackson.deserialization.fail-on-null-for-primitives=false


# ===================================================================
# SPRINGDOC / OPENAPI 3 (Swagger UI y Scalar)
# ===================================================================
# Rutas de la documentación (abiertas en el navegador para poder leer el
# contrato; la API sigue exigiendo JWT, ver WebSecurityConfig):
#   - JSON/YAML del contrato OpenAPI: /v3/api-docs
#   - Swagger UI: /swagger-ui.html
#   - Scalar UI: /scalar
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true


