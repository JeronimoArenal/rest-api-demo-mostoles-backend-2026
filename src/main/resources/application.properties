spring.application.name=rest-api-demo-mostoles-backend-2026

# ===================================================================
# SECURITY (false -> desactiva - true -> activa)
# ===================================================================
app.security.enabled=true

# ===================================================================
# RENDIMIENTO MAXIMO (Java 25 Virtual Threads)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# POOL DE DATOS STANDARD: BASE DE DATOS PRINCIPAL (MySQL 8.4 LTS)
# ===================================================================

#Configurar las credenciales de conexion a la base de datos
spring.datasource.url=jdbc:mysql://192.168.122.43:3306/comercio_mostoles?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_MYSQL_USERNAME:root}
spring.datasource.password=${DB_MYSQL_PASSWORD:Kose9suf}
# Si nop tenemos declaradas las variablas de entorno, comentar las anteriores y descomentar estas con datos validos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del Pool de Hikari estándar
spring.datasource.hikari.maximum-pool-size=30

# ===================================================================
# CONFIGURACION GLOBAL DE HIBERNATE / JPA
# ===================================================================
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

# Clave secreta de 256 bits para producción
# Se pueden generar tokens en la siguiente url https://jwtsecrets.com/#generator
demo.app.jwtSecret=bXktc3VwZXItc2VjcmV0LWtleS1mb3ItanZ0LTIwMjYtY29tZXJjaW8tbW9zdG9sZXM=
demo.app.jwtExpirationMs=86400000

# FileUpload and Download
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Para que un tipo primitivo que no admita null le asigne el valor de cero
spring.jackson.deserialization.fail-on-null-for-primitives=false


